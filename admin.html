<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Admin Premium - Marrant Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-glass: rgba(255, 255, 255, 0.03);
            --bg-glass-heavy: rgba(255, 255, 255, 0.08);
            --primary: #facc15;
            --primary-glow: rgba(250, 204, 21, 0.3);
            --green: #22c55e;
            --red: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #1a1a20, var(--bg-dark));
            color: var(--text);
            margin: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* GLASS CARD */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1, h2, h3 {
            margin-top: 0;
            letter-spacing: -0.02em;
        }

        /* LOGIN BOX */
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: var(--bg-glass-heavy);
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.12);
        }

        button {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        button.outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        button.outline:hover {
            background: var(--bg-glass-heavy);
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: var(--bg-glass);
            padding: 8px;
            border-radius: 14px;
            width: fit-content;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--primary);
            color: var(--bg-dark);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(255,255,255,0.2);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .status-locked { background: rgba(255,255,255,0.05); color: #fff; }
        .status-current { background: var(--primary-glow); color: var(--primary); }
        .status-done { background: rgba(34, 197, 94, 0.1); color: var(--green); }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--green);
            color: var(--bg-dark);
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 700;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        #export-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 900;
        }

        .version-tag {
            position: fixed;
            bottom: 10px;
            right: 20px;
            font-size: 0.7rem;
            color: #333;
        }
    </style>
</head>

<body>
    <div id="toast" class="toast">Action réussie !</div>

    <script src="data.js"></script>

    <!-- AUTH SECTION -->
    <div id="auth-section" class="container">
        <div class="glass login-box">
            <div style="font-size: 3rem; margin-bottom: 20px;">🔒</div>
            <h2>Administration</h2>
            <p style="color:var(--muted); margin-bottom: 30px;">Accès sécurisé au Tour de France</p>
            <input type="password" id="admin-pass" placeholder="Mot de passe">
            <button onclick="login()" style="width: 100%; justify-content: center;">Entrer dans le panel</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="container" style="display:none; padding-bottom: 100px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 40px;">
            <div>
                <h1 style="margin:0;">Dashboard <span style="color:var(--primary)">MC</span></h1>
                <p style="color:var(--muted); margin: 5px 0 0 0;">Tour de France - Pilotage en temps réel</p>
            </div>
            <button class="outline" onclick="location.reload()"><i class="fa-solid fa-sign-out"></i></button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('tab-carte')">🗺️ Carte & Défis</button>
            <button class="tab" onclick="switchTab('tab-live')">🔴 Paramètres Live</button>
            <button class="tab" onclick="switchTab('tab-reception')">📥 Suggestions</button>
        </div>

        <!-- ONGLET GESTION CARTE -->
        <div id="tab-carte" class="tab-content active">
            <div style="margin-bottom: 30px;">
                <input type="text" id="search-dept" placeholder="Rechercher un département..."
                    onkeyup="renderDepts()" style="max-width: 400px; margin-bottom: 0;">
            </div>
            <div class="grid" id="depts-grid"></div>
        </div>

        <!-- ONGLET LIVE -->
        <div id="tab-live" class="tab-content">
            <div class="glass" style="max-width: 600px;">
                <h2>Paramètres du Direct</h2>
                <div class="form-group">
                    <label>Statut du Live</label>
                    <select id="live-isLive">
                        <option value="true">EN DIRECT (Bandeau rouge actif)</option>
                        <option value="false">HORS LIGNE (Bandeau masqué)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Département Actuel (ID)</label>
                    <input type="text" id="live-currentDept" placeholder="Ex: 02">
                </div>
                <div class="form-group">
                    <label>URL du flux (Twitch/YouTube)</label>
                    <input type="text" id="live-watchUrl" placeholder="https://twitch.tv/marrantclub">
                </div>
                <button onclick="saveLiveConfig()"><i class="fa-solid fa-save"></i> Mettre à jour</button>
            </div>
        </div>

        <!-- ONGLET SUGGESTIONS -->
        <div id="tab-reception" class="tab-content">
            <div id="list-defis">
                <p style="color:var(--muted);">Chargement des suggestions...</p>
            </div>
            <button class="outline" onclick="fetchDefis(document.getElementById('admin-pass').value)" style="margin-top:20px;">
                <i class="fa-solid fa-sync"></i> Rafraîchir la liste
            </button>
        </div>

        <button id="export-btn" onclick="exportData()">
            <i class="fa-solid fa-cloud-download-alt"></i> GÉNÉRER DATA.JS
        </button>
    </div>

    <div class="version-tag">Premium v3.0 | <span id="server-time">Offline</span></div>

    <script>
        let localDepts = [];
        let localLive = {};

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function login() {
            const pass = document.getElementById('admin-pass').value;
            if (!pass) {
                alert("Veuillez saisir le mot de passe.");
                return;
            }

            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';

            localDepts = JSON.parse(JSON.stringify(DEPARTMENTS));
            localLive = JSON.parse(JSON.stringify(LIVE_CONFIG));

            initLiveTab();
            renderDepts();
            fetchDefis(pass);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => {
                if (t.getAttribute('onclick').includes(tabId)) t.classList.add('active');
            });
        }

        function renderDepts() {
            const grid = document.getElementById('depts-grid');
            grid.innerHTML = '';
            const search = document.getElementById('search-dept').value.toLowerCase();

            localDepts.forEach((dept, index) => {
                if (search && !dept.name.toLowerCase().includes(search) && !dept.id.includes(search)) return;

                let statusClass = dept.state === 'done' ? 'status-done' : (dept.state === 'current' ? 'status-current' : 'status-locked');
                let statusLabel = dept.state === 'done' ? 'Validé' : (dept.state === 'current' ? 'En cours' : 'Secret');

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
                        <div>
                            <span style="font-size:0.7rem; color:var(--muted); font-weight:700;">DÉPT ${dept.id}</span>
                            <h3 style="margin:0;">${dept.name}</h3>
                        </div>
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <select onchange="updateDept(${index}, 'state', this.value)" style="margin-bottom:0; font-size:0.85rem; padding:10px;">
                            <option value="locked" ${dept.state === 'locked' ? 'selected' : ''}>État : Secret (Noir)</option>
                            <option value="current" ${dept.state === 'current' ? 'selected' : ''}>État : En cours (Jaune)</option>
                            <option value="done" ${dept.state === 'done' ? 'selected' : ''}>État : Validé (Vert)</option>
                        </select>
                    </div>

                    <div id="details-${index}" style="display: ${dept.state === 'locked' ? 'none' : 'block'}; border-top: 1px solid var(--border); padding-top: 15px;">
                        <input type="text" value="${dept.challengeTitle || ''}" onchange="updateDept(${index}, 'challengeTitle', this.value)" placeholder="Titre du défi">
                        <textarea rows="3" onchange="updateDept(${index}, 'challengeSummary', this.value)" placeholder="Résumé du défi">${dept.challengeSummary || ''}</textarea>
                        <input type="text" value="${dept.youtubeId || ''}" onchange="updateDept(${index}, 'youtubeId', this.value)" placeholder="ID Vidéo YouTube">
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.updateDept = function (index, field, value) {
            if (value === "") value = null;
            localDepts[index][field] = value;
            if (field === 'state') renderDepts();
        };

        function initLiveTab() {
            document.getElementById('live-isLive').value = localLive.isLive ? "true" : "false";
            document.getElementById('live-currentDept').value = localLive.currentDept || "";
            document.getElementById('live-watchUrl').value = localLive.watchUrl || "";
        }

        window.saveLiveConfig = function () {
            localLive.isLive = document.getElementById('live-isLive').value === "true";
            localLive.currentDept = document.getElementById('live-currentDept').value;
            const d = localDepts.find(d => d.id === localLive.currentDept);
            if (d) localLive.currentDeptName = d.name;
            localLive.watchUrl = document.getElementById('live-watchUrl').value;
            showToast("Config Live enregistrée !");
        };

        window.fetchDefis = async function (pass) {
            const container = document.getElementById('list-defis');
            container.innerHTML = '<p style="color:var(--muted);">Connexion au serveur...</p>';
            try {
                const res = await fetch('/api/api-view', {
                    headers: { 'x-password': pass }
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('server-time').textContent = data.timestamp || 'Online';
                    
                    container.innerHTML = '';
                    if (!data.defis || data.defis.length === 0) {
                        container.innerHTML = '<p>Aucune suggestion pour le moment.</p>';
                        return;
                    }
                    
                    data.defis.forEach(d => {
                        container.innerHTML += `<div class="card" style="margin-bottom:15px; border-left: 4px solid var(--primary);">
                            <div style="font-weight:700; color:var(--primary); margin-bottom:5px;">${d.pseudo} (Dépt ${d.departement})</div>
                            <div style="font-size:0.9rem;">${d.message}</div>
                        </div>`;
                    });
                } else {
                    const errData = await res.json().catch(() => ({}));
                    if (res.status === 401) {
                        container.innerHTML = `<div style="color:var(--red); font-weight:700; margin-bottom:10px;">❌ Mot de passe incorrect</div>
                        <div style="font-size:0.75rem; color:var(--muted); border-top:1px solid var(--border); padding-top:8px;">INDICE SÉCURITÉ : ${errData.debug || 'Ancien serveur détecté'}</div>`;
                    }
                    else container.innerHTML = `<p style="color:var(--red);">Erreur ${res.status}: ${errData.error || 'Erreur serveur'}</p>`;
                }
            } catch (err) {
                container.innerHTML = '<p style="color:var(--red);">⚠️ Erreur de connexion (Vérifie Vercel).</p>';
            }
        };

        window.exportData = function () {
            let fileContent = `// ============================================================
// DATA.JS – Marrant Club Tour de France
// Fichier généré automatiquement depuis l'interface Premium
// ============================================================

const DEPARTMENTS = ${JSON.stringify(localDepts, null, 2)};

const LIVE_CONFIG = ${JSON.stringify(localLive, null, 2)};
`;
            const blob = new Blob([fileContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("data.js téléchargé !");
        };
    </script>
</body>
</html>
